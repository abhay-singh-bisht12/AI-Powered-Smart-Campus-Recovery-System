<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - Campus Lost & Found</title>

  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>

<body data-page="login">
  <section class="auth-page">
    <div class="auth-card">
      <div class="auth-left">
        <span class="tag">Campus Safety Portal</span>
        <h1>Welcome Back</h1>
        <p>Login to continue and manage your lost and found reports.</p>
      </div>

      <div class="auth-right">
        <h2>Login</h2>

        <form id="loginForm">
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="loginEmail" required />
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="loginPassword" required />
  </div>

  <button type="submit" class="btn primary full-btn">Login</button>
  <p id="loginMessage" class="message-text"></p>

  <p class="forgot-text">
    Forgot Password?
    <a href="forgot-password.html" class="text-link">Reset here</a>
  </p>
</form>

        <p class="switch-text">
          New user?
          <a href="register.html" class="text-link">Go to Register</a>
        </p>
      </div>
    </div>
  </section>
</body>
</html>
