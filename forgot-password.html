<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password - Campus Lost & Found</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="auth-page">
    <div class="auth-card">
      
      <div class="auth-left">
        <span class="tag">Campus Safety Portal</span>
        <h1>Reset Password</h1>
        <p>Enter your registered email and create a new password.</p>
      </div>

      <div class="auth-right">
        <h2>Forgot Password</h2>

        <form id="resetForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required />
          </div>

          <button type="submit" class="btn primary full-btn">
            Reset Password
          </button>

          <p id="msg" class="message-text"></p>
        </form>

        <p class="switch-text">
          Remember password?
          <a href="login.html" class="text-link">Back to Login</a>
        </p>
      </div>

    </div>
  </section>

  <script>
    document.getElementById("resetForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const newPassword = document.getElementById("newPassword").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "Please wait...";
      msg.style.color = "#2563eb";

      try {
        const res = await fetch("http://localhost:5000/api/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, newPassword })
        });

        const data = await res.json();

        if (res.ok) {
          msg.textContent = data.message || "Password updated successfully";
          msg.style.color = "green";

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          msg.textContent = data.message || "Password reset failed";
          msg.style.color = "red";
        }
      } catch (error) {
        console.error(error);
        msg.textContent = "Server not connected";
        msg.style.color = "red";
      }
    });
  </script>

</body>
</html>
