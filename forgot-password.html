<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password - Campus Lost & Found</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="auth-page">
    <div class="auth-card">

      <div class="auth-left">
        <span class="tag">Campus Safety Portal</span>
        <h1>Reset Password</h1>
        <p>Verify your email using OTP and create a new password.</p>
      </div>

      <div class="auth-right">
        <h2>Forgot Password</h2>

        <!-- STEP 1: SEND OTP -->

        <form id="sendOtpForm">
          <div class="form-group">
            <label for="email">Registered Email</label>

            <input
              type="email"
              id="email"
              placeholder="Enter your registered email"
              required
            />
          </div>

          <button
            type="submit"
            id="sendOtpButton"
            class="btn primary full-btn"
          >
            Send OTP
          </button>
        </form>

        <!-- STEP 2: VERIFY OTP -->

        <form id="verifyOtpForm" style="display: none;">
          <div class="form-group">
            <label for="otp">Enter OTP</label>

            <input
              type="text"
              id="otp"
              placeholder="Enter 6 digit OTP"
              maxlength="6"
              inputmode="numeric"
              required
            />
          </div>

          <button
            type="submit"
            id="verifyOtpButton"
            class="btn primary full-btn"
          >
            Verify OTP
          </button>

          <button
            type="button"
            id="resendOtpButton"
            class="btn secondary full-btn"
          >
            Resend OTP
          </button>
        </form>

        <!-- STEP 3: RESET PASSWORD -->

        <form id="resetPasswordForm" style="display: none;">
          <div class="form-group">
            <label for="newPassword">New Password</label>

            <input
              type="password"
              id="newPassword"
              placeholder="Enter new password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm new password"
              required
            />
          </div>

          <button
            type="submit"
            id="resetPasswordButton"
            class="btn primary full-btn"
          >
            Reset Password
          </button>
        </form>

        <p id="msg" class="message-text"></p>

        <p class="switch-text">
          Remember password?
          <a href="login.html" class="text-link">Back to Login</a>
        </p>
      </div>

    </div>
  </section>

  <script>
    const API_BASE_URL = "http://localhost:5000";

    const sendOtpForm = document.getElementById("sendOtpForm");
    const verifyOtpForm = document.getElementById("verifyOtpForm");
    const resetPasswordForm =
      document.getElementById("resetPasswordForm");

    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const newPasswordInput =
      document.getElementById("newPassword");
    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const sendOtpButton =
      document.getElementById("sendOtpButton");
    const verifyOtpButton =
      document.getElementById("verifyOtpButton");
    const resendOtpButton =
      document.getElementById("resendOtpButton");
    const resetPasswordButton =
      document.getElementById("resetPasswordButton");

    const msg = document.getElementById("msg");

    let verifiedEmail = "";
    let activeRequests = 0;
    let loaderTimers = [];

    function showMessage(message, type = "info") {
      msg.textContent = message;

      if (type === "success") {
        msg.style.color = "green";
      } else if (type === "error") {
        msg.style.color = "red";
      } else {
        msg.style.color = "#2563eb";
      }
    }

    function showTopLoader() {
      activeRequests++;

      if (activeRequests > 1) return;

      let loader = document.getElementById("topLoader");

      if (!loader) {
        loader = document.createElement("div");
        loader.id = "topLoader";
        document.body.appendChild(loader);
      }

      loaderTimers.forEach(clearTimeout);
      loaderTimers = [];

      loader.style.width = "15%";

      loaderTimers.push(
        setTimeout(() => {
          loader.style.width = "45%";
        }, 120)
      );

      loaderTimers.push(
        setTimeout(() => {
          loader.style.width = "75%";
        }, 350)
      );

      loaderTimers.push(
        setTimeout(() => {
          loader.style.width = "90%";
        }, 800)
      );
    }

    function hideTopLoader() {
      activeRequests = Math.max(0, activeRequests - 1);

      if (activeRequests > 0) return;

      const loader = document.getElementById("topLoader");

      if (!loader) return;

      loaderTimers.forEach(clearTimeout);
      loaderTimers = [];

      loader.style.width = "100%";

      setTimeout(() => {
        loader.style.width = "0%";
      }, 250);
    }

    function startButtonLoading(button, loadingText) {
      if (!button || button.dataset.loading === "true") {
        return false;
      }

      button.dataset.loading = "true";
      button.dataset.originalHtml = button.innerHTML;
      button.disabled = true;

      button.innerHTML = `
        <span class="button-spinner"></span>
        <span>${loadingText}</span>
      `;

      return true;
    }

    function stopButtonLoading(button) {
      if (!button) return;

      if (button.dataset.originalHtml !== undefined) {
        button.innerHTML = button.dataset.originalHtml;
      }

      button.disabled = false;

      delete button.dataset.loading;
      delete button.dataset.originalHtml;
    }

    async function readResponse(response) {
      const text = await response.text();

      if (!text) return {};

      try {
        return JSON.parse(text);
      } catch {
        return {
          message: text
        };
      }
    }

    async function forgotPasswordRequest(
      path,
      body,
      button,
      loadingText
    ) {
      if (!startButtonLoading(button, loadingText)) {
        throw new Error("Request already running");
      }

      showTopLoader();

      try {
        const response = await fetch(
          `${API_BASE_URL}${path}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          }
        );

        const data = await readResponse(response);

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "Request failed"
          );
        }

        return data;
      } finally {
        stopButtonLoading(button);
        hideTopLoader();
      }
    }

    async function sendOtp() {
      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        showMessage("Please enter your email", "error");
        return;
      }

      showMessage("Please wait...", "info");

      try {
        const data = await forgotPasswordRequest(
          "/api/forgot-password/send-otp",
          {
            email
          },
          sendOtpButton,
          "Sending OTP..."
        );

        verifiedEmail = email;

        emailInput.disabled = true;
        sendOtpForm.style.display = "none";
        verifyOtpForm.style.display = "block";

        showMessage(
          data.message || "OTP sent successfully",
          "success"
        );

        otpInput.focus();
      } catch (error) {
        console.error("Send OTP error:", error);

        showMessage(
          error.message ||
          "Server not connected. Please try again.",
          "error"
        );
      }
    }

    sendOtpForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();
        await sendOtp();
      }
    );

    resendOtpButton.addEventListener(
      "click",
      async function () {
        if (!verifiedEmail) {
          showMessage(
            "Please enter your email again",
            "error"
          );

          return;
        }

        showMessage("Sending OTP again...", "info");

        try {
          const data = await forgotPasswordRequest(
            "/api/forgot-password/send-otp",
            {
              email: verifiedEmail
            },
            resendOtpButton,
            "Sending..."
          );

          otpInput.value = "";

          showMessage(
            data.message ||
            "OTP sent again successfully",
            "success"
          );

          otpInput.focus();
        } catch (error) {
          console.error("Resend OTP error:", error);

          showMessage(
            error.message ||
            "Server not connected. Please try again.",
            "error"
          );
        }
      }
    );

    verifyOtpForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        const otp = otpInput.value.trim();

        if (!/^\d{6}$/.test(otp)) {
          showMessage(
            "Please enter a valid 6 digit OTP",
            "error"
          );

          return;
        }

        showMessage("Verifying OTP...", "info");

        try {
          const data = await forgotPasswordRequest(
            "/api/forgot-password/verify-otp",
            {
              email: verifiedEmail,
              otp
            },
            verifyOtpButton,
            "Verifying..."
          );

          verifyOtpForm.style.display = "none";
          resetPasswordForm.style.display = "block";

          showMessage(
            data.message ||
            "OTP verified successfully",
            "success"
          );

          newPasswordInput.focus();
        } catch (error) {
          console.error("Verify OTP error:", error);

          showMessage(
            error.message ||
            "Server not connected. Please try again.",
            "error"
          );
        }
      }
    );

    resetPasswordForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        const newPassword =
          newPasswordInput.value.trim();

        const confirmPassword =
          confirmPasswordInput.value.trim();

        if (!newPassword || !confirmPassword) {
          showMessage(
            "Please enter and confirm your new password",
            "error"
          );

          return;
        }

        if (newPassword !== confirmPassword) {
          showMessage(
            "New password and confirm password do not match",
            "error"
          );

          return;
        }

        const strongPasswordPattern =
          /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,}$/;

        if (!strongPasswordPattern.test(newPassword)) {
          showMessage(
            "Password must have at least 8 characters, uppercase, lowercase, number and special character",
            "error"
          );

          return;
        }

        showMessage("Please wait...", "info");

        try {
          const data = await forgotPasswordRequest(
            "/api/forgot-password/reset",
            {
              email: verifiedEmail,
              newPassword,
              confirmPassword
            },
            resetPasswordButton,
            "Resetting Password..."
          );

          showMessage(
            data.message ||
            "Password reset successfully",
            "success"
          );

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } catch (error) {
          console.error(
            "Reset password error:",
            error
          );

          showMessage(
            error.message ||
            "Server not connected. Please try again.",
            "error"
          );
        }
      }
    );

    otpInput.addEventListener(
      "input",
      function () {
        this.value = this.value
          .replace(/\D/g, "")
          .slice(0, 6);
      }
    );
  </script>
</body>
</html>
