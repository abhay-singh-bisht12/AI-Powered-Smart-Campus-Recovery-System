<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports - Campus Lost & Found</title>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <script src="app.js?v=5.0.0" defer></script>
</head>
<body data-page="my-reports">
  <header class="inner-header">
    <div class="container header-bar">
      <div class="nav-top-row">
        <div class="logo">Campus Lost & Found</div>
        <button id="mobileMenuToggle" class="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">☰</button>
      </div>
      <div id="mainNavLinks" class="nav-links dark-links">
        <a href="dashboard.html" data-i18n="home">Home</a>

    <section class="panel">
      <div class="section-head">

  <div id="modal" class="modal hidden"><div class="modal-box"><button id="closeModal" class="close-btn">&times;</button><div id="modalContent"></div></div></div>
